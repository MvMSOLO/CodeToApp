name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-checks:
    name: Validate source and build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build:dev
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Start development server for auth invariant
        run: |
          npm run dev > /tmp/codetoapp-dev.log 2>&1 &
          echo $! > /tmp/codetoapp-dev.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/__app-env > /tmp/codetoapp-app-env.json; then
              cat /tmp/codetoapp-app-env.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/codetoapp-dev.log
          echo "::error::Development server did not expose /__app-env within 60 seconds."
          exit 1
      - name: Auth invariants
        run: npm run check:auth
      - name: Stop development server
        if: always()
        run: |
          if [ -f /tmp/codetoapp-dev.pid ]; then
            kill "$(cat /tmp/codetoapp-dev.pid)" 2>/dev/null || true
          fi
      - name: Inspect generated web output
        run: |
          echo "Vercel static output:"
          find .vercel/output/static -maxdepth 2 -type f 2>/dev/null | head -80 || true
          echo "Nitro output:"
          find .output -maxdepth 2 -type f 2>/dev/null | head -80 || true
      - name: Upload web build output
        uses: actions/upload-artifact@v4
        with:
          name: codetoapp-web-build
          path: |
            .vercel/output/static/
            .output/public/
            dist/
          if-no-files-found: warn
          retention-days: 7

  android-apk:
    name: Package Android APK
    runs-on: ubuntu-latest
    needs: source-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install temporary Capacitor toolchain
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
      - name: Build Android web bundle
        run: |
          npx vite build --config vite.android.config.ts
          # Capacitor requires the web root to contain index.html.
          mv android-web/android.html android-web/index.html
      - name: Generate native Android wrapper
        run: npx cap add android && npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeToApp-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
