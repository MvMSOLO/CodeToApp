name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'vite.config.ts'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    name: Source checks and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Auth invariants
        run: npm run check:auth
      - name: Build application
        run: npm run build:dev
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: codetoapp-web-build
          path: |
            .output/
            dist/
          if-no-files-found: error
          retention-days: 7

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: web-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Build app
        run: npm run build:dev
      - name: Verify Android project exists
        run: |
          if [ ! -f android/gradlew ]; then
            echo "::error::This source archive does not include an Android Gradle project. Add a Capacitor/TWA Android wrapper before APK packaging can run."
            exit 1
          fi
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeToApp-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
