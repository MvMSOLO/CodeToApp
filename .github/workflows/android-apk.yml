name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-checks:
    name: Validate source and build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build:dev
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Auth invariants
        run: npm run check:auth
      - name: Upload web build output
        uses: actions/upload-artifact@v4
        with:
          name: codetoapp-web-build
          path: |
            .output/
            dist/
          if-no-files-found: warn
          retention-days: 7

  android-apk:
    name: Package Android APK
    runs-on: ubuntu-latest
    needs: source-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify native Android wrapper exists
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::No Android Gradle wrapper is committed. This web workspace must first be converted/configured as an Android app (for example with a suitable Capacitor/TWA setup); this workflow will not fabricate an APK."
            exit 1
          fi
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeToApp-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
